name: Weekly AI digest

on:
  # The weekly schedule is off because this repository's config.yaml uses
  # `provider: claude_cli`, which needs the `claude` binary and Claude Code's
  # login - neither of which exists on a GitHub runner, so a scheduled run would
  # fail every Monday. The digest is produced locally instead, by the launchd
  # agent com.jhard99.ainews.weekly (see "Scheduling" in the README).
  #
  # Re-enable this if you switch to a provider CI can authenticate as - an API
  # key, Bedrock or Vertex - or if you want a keyword-only digest, in which case
  # also set llm.enabled: false.
  #
  # schedule:
  #   # Mondays 13:00 UTC (09:00 ET / 06:00 PT). Cron runs on UTC year-round.
  #   - cron: "0 13 * * 1"
  workflow_dispatch:
    inputs:
      window_days:
        description: "How many days back to collect"
        required: false
        default: "7"
      dry_run:
        description: "Write the digest but do not send email"
        type: boolean
        required: false
        default: false
      no_llm:
        description: "Skip Claude entirely (keyword triage; needs no API key)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  # The digest is posted as an issue, so it lands somewhere you get notified
  # about even with no SMTP secrets configured.
  issues: write

concurrency:
  group: weekly-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # Job-level rather than on the digest step alone, so that `ainews check
    # --probe` sees the same credentials the real run will. Scoped to one step,
    # the probe reported "[MISSING] newsletters (needs: username, password)"
    # while the very next step logged in fine - a confusing way to be told
    # nothing is wrong.
    env:
      # Only needed with llm.provider: anthropic. For Bedrock, drop this and add
      # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_REGION secrets (or
      # configure OIDC with aws-actions/configure-aws-credentials); for Vertex,
      # authenticate with google-github-actions/auth and set GCP_PROJECT. With
      # llm.enabled: false, no model credentials are needed at all.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
      # Reddit's robots.txt disallows anonymous reads, so the reddit source uses
      # the OAuth API. Register a "script" app at
      # https://www.reddit.com/prefs/apps. Unset = the source sits out.
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      IMAP_HOST: ${{ secrets.IMAP_HOST }}
      IMAP_PORT: ${{ secrets.IMAP_PORT }}
      IMAP_USER: ${{ secrets.IMAP_USER }}
      IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
      IMAP_FOLDER: ${{ secrets.IMAP_FOLDER }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
      DIGEST_TO: ${{ secrets.DIGEST_TO }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      # Carries the "already covered" database between runs so the digest does
      # not repeat last week's stories.
      - name: Restore state
        uses: actions/cache@v4
        with:
          path: state
          key: ainews-state-${{ github.run_id }}
          restore-keys: |
            ainews-state-

      # Optional: your own logged-in cookies for subscription sites, exported in
      # Netscape format and stored base64-encoded as a repository secret. Without
      # it the run uses those publishers' public feeds only.
      - name: Write subscription cookies
        env:
          NEWS_COOKIES_B64: ${{ secrets.NEWS_COOKIES_B64 }}
        run: |
          if [ -z "$NEWS_COOKIES_B64" ]; then
            echo "No cookie secret set - subscription sites will use abstracts only."
            exit 0
          fi
          echo "$NEWS_COOKIES_B64" | base64 -d > cookies.txt
          chmod 600 cookies.txt
          echo "NEWS_COOKIES_FILE=$PWD/cookies.txt" >> "$GITHUB_ENV"

      # Feeds die quietly: they 404, or keep answering 200 while frozen. This
      # reports every source's real item count and never fails the run, so a
      # dead feed shows up in the log instead of just thinning the digest.
      - name: Probe sources
        continue-on-error: true
        run: python -m ainews check --probe || true

      # config.yaml may name a provider that only exists on a developer's
      # machine - claude_cli authenticates as Claude Code and needs its binary,
      # which no runner has. Rather than let the manual "Run workflow" button
      # fail on that, detect it and fall back to the keyword digest, which needs
      # no credentials at all.
      - name: Decide whether this run can reach a model
        id: llm
        run: |
          set -euo pipefail
          provider=$(python -c "import yaml; cfg = yaml.safe_load(open('config.yaml')) or {}; print((cfg.get('llm') or {}).get('provider', 'anthropic'))")
          echo "configured provider: $provider"
          if [ "$provider" = "claude_cli" ] && ! command -v claude >/dev/null 2>&1; then
            echo "::warning::provider is claude_cli, but the claude binary only exists on the machine that runs Claude Code. Falling back to --no-llm for this run: you get the keyword digest, not the written one. Set an API key (or Bedrock/Vertex) and change llm.provider if you want synthesis in CI."
            echo "no_llm=true" >> "$GITHUB_OUTPUT"
          else
            echo "no_llm=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate and send digest
        run: |
          python -m ainews --verbose run \
            --window-days "${{ github.event.inputs.window_days || 7 }}" \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }} \
            ${{ (github.event.inputs.no_llm == 'true' || steps.llm.outputs.no_llm == 'true') && '--no-llm' || '' }}

      - name: Remove cookies
        if: always()
        run: rm -f cookies.txt

      # Delivery that needs no secrets at all: the digest becomes an issue, so
      # you get a GitHub notification even before SMTP is set up. Email (above)
      # still goes out when the SMTP secrets exist; this is in addition to it.
      - name: Post digest as an issue
        # success() is explicit: adding any `if` to a step drops the implicit
        # "only if nothing failed" guard, and a failed run must not post.
        if: ${{ success() && github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          digest="$(ls -t digests/*.md 2>/dev/null | head -1 || true)"
          if [ -z "$digest" ]; then
            echo "No digest markdown found - nothing to post."
            exit 0
          fi
          title="AI weekly — $(basename "$digest" .md)"
          # An issue body is capped at 65536 characters; keep well under it and
          # point at the committed file for the full text.
          body_file="$(mktemp)"
          head -c 60000 "$digest" > "$body_file"
          if [ "$(wc -c < "$digest")" -gt 60000 ]; then
            printf '\n\n---\n_Truncated. Full digest: `%s` in this repository._\n' \
              "$digest" >> "$body_file"
          fi
          gh issue create --title "$title" --body-file "$body_file" \
            --repo "$GITHUB_REPOSITORY" || {
              echo "Could not create the issue (are Issues enabled for this repo?)."
              exit 0
            }

      - name: Upload digest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest
          path: digests/
          if-no-files-found: warn
          retention-days: 90

      - name: Commit digest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digests/
          if git diff --cached --quiet; then
            echo "No new digest to commit."
          else
            git commit -m "Add AI digest for $(date -u +%G-W%V)"
            git push
          fi
