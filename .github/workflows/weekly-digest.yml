name: Weekly AI digest

on:
  schedule:
    # Mondays 13:00 UTC (09:00 ET / 06:00 PT). Cron runs on UTC year-round.
    - cron: "0 13 * * 1"
  workflow_dispatch:
    inputs:
      window_days:
        description: "How many days back to collect"
        required: false
        default: "7"
      dry_run:
        description: "Write the digest but do not send email"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: weekly-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      # Carries the "already covered" database between runs so the digest does
      # not repeat last week's stories.
      - name: Restore state
        uses: actions/cache@v4
        with:
          path: state
          key: ainews-state-${{ github.run_id }}
          restore-keys: |
            ainews-state-

      # Optional: your own logged-in cookies for subscription sites, exported in
      # Netscape format and stored base64-encoded as a repository secret. Without
      # it the run uses those publishers' public feeds only.
      - name: Write subscription cookies
        env:
          NEWS_COOKIES_B64: ${{ secrets.NEWS_COOKIES_B64 }}
        run: |
          if [ -z "$NEWS_COOKIES_B64" ]; then
            echo "No cookie secret set - subscription sites will use abstracts only."
            exit 0
          fi
          echo "$NEWS_COOKIES_B64" | base64 -d > cookies.txt
          chmod 600 cookies.txt
          echo "NEWS_COOKIES_FILE=$PWD/cookies.txt" >> "$GITHUB_ENV"

      - name: Generate and send digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_PORT: ${{ secrets.IMAP_PORT }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          IMAP_FOLDER: ${{ secrets.IMAP_FOLDER }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
        run: |
          python -m ainews --verbose run \
            --window-days "${{ github.event.inputs.window_days || 7 }}" \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      - name: Remove cookies
        if: always()
        run: rm -f cookies.txt

      - name: Upload digest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest
          path: digests/
          if-no-files-found: warn
          retention-days: 90

      - name: Commit digest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digests/
          if git diff --cached --quiet; then
            echo "No new digest to commit."
          else
            git commit -m "Add AI digest for $(date -u +%G-W%V)"
            git push
          fi
