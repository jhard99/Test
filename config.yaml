# ainews configuration.
#
# Copy to config.yaml and edit. Secrets never belong in here - write ${ENV_VAR}
# and keep the value in .env locally or in GitHub Actions secrets in CI.
# ${VAR:-default} works too.

window_days: 7            # how far back each run looks
max_items_per_source: 80  # cap per source, before filtering
max_stories: 12           # top stories in the digest
per_item_chars: 8000      # article text handed to the writer per item
min_importance: 2         # 1..5; drop anything triaged below this

output_dir: digests
state_db: state/ainews.sqlite3

llm:
  # How Claude is reached:
  #   anthropic  - first-party API. Uses ANTHROPIC_API_KEY, ANTHROPIC_AUTH_TOKEN,
  #                or an `ant auth login` profile.
  #   claude_cli - shells out to the `claude` CLI (Claude Code) in
  #                non-interactive mode, using Claude Code's own login. The one
  #                option that needs neither an API key nor access to
  #                platform.claude.com, so it works where an organization allows
  #                Claude Code but blocks the API and Console. Note: no
  #                server-side web search, so the `websearch` source skips
  #                itself, and no structured outputs, so triage JSON is parsed
  #                tolerantly rather than schema-enforced.
  #   bedrock   - Amazon Bedrock, using your normal AWS credentials.
  #               Note: Bedrock has no server-side web search, so the
  #               `websearch` source below skips itself automatically.
  #   vertex    - Google Cloud Vertex AI, using GCP application-default creds.
  #               Set vertex_project. Web search works (basic variant).
  #   foundry   - Microsoft Foundry. Set foundry_resource.
  provider: claude_cli
  aws_region: ${AWS_REGION:-us-east-1}
  vertex_project: ${GCP_PROJECT:-}
  vertex_region: ${GCP_REGION:-global}
  foundry_resource: ${FOUNDRY_RESOURCE:-}

  # Set false to run with no model access at all. The digest is then built with
  # keyword triage and clustering: filtered, ranked and grouped by topic, but
  # without the written synthesis. Same as passing --no-llm.
  enabled: true

  # The digest writer. Keep this on the strongest model you're willing to pay for.
  model: claude-opus-5
  # Triage + clustering run over every candidate item, so this is where volume
  # lives - about 7 batches a week at a 7-day window. On provider: claude_cli
  # that volume is charged against a Claude subscription's quota rather than a
  # bill, which is a smaller budget, so this runs on Haiku: measured through the
  # CLI it returns schema-valid triage JSON, preserves item indices and rejects
  # non-AI stories correctly, for roughly a fifth of Opus's token cost. The
  # writer below stays on Opus, which is where digest quality actually comes
  # from. Raise this to claude-sonnet-5 if triage judgement looks too blunt.
  triage_model: claude-haiku-4-5
  triage_effort: low
  writer_effort: high
  triage_batch_size: 40
  max_output_tokens: 32000

http:
  user_agent: "ainews-digest/0.1 (personal weekly AI digest)"
  requests_per_minute: 20   # per host
  respect_robots: true
  timeout: 30
  # Domains allowed to receive cookies from NEWS_COOKIES_FILE. Cookies for any
  # other domain in that file are discarded at load time.
  cookie_domains:
    - nytimes.com
    - wsj.com
    - theatlantic.com

delivery:
  smtp:
    host: ${SMTP_HOST:-smtp.gmail.com}
    port: ${SMTP_PORT:-587}
    username: ${SMTP_USER}
    password: ${SMTP_PASSWORD}
    sender: ${DIGEST_FROM}
    recipients:
      - ${DIGEST_TO}
    use_tls: true
    subject_template: "AI weekly - {start} to {end}"

sources:
  # --- your newsletter subscriptions, read from your inbox -------------------
  - type: imap
    name: newsletters
    host: ${IMAP_HOST:-imap.gmail.com}
    port: ${IMAP_PORT:-993}
    username: ${IMAP_USER}
    password: ${IMAP_PASSWORD}
    folder: ${IMAP_FOLDER:-INBOX}
    max_items: 25
    # Optional narrowing. Drop `senders` to take everything in the folder -
    # best paired with a Gmail filter that labels newsletters into their own
    # folder, e.g. folder: "AI News".
    senders:
      - importai
      - tldr
      - bensbites
      - deeplearning.ai
      - platformer
      - stratechery
      - theneurondaily
      - substack.com
    # subject_include: ["AI", "LLM", "model"]
    unread_only: false
    mark_seen: false

  # --- subscription news sites ----------------------------------------------
  # Public feeds give headline + abstract. Full article text is read only when
  # NEWS_COOKIES_FILE holds your own logged-in cookies for the domain.
  - type: paywalled
    name: NYT Technology
    domain: nytimes.com
    url: https://rss.nytimes.com/services/xml/rss/nyt/Technology.xml
    # full_text is off. Measured against a real logged-in session, nytimes.com
    # answers HTTP 403 to a non-browser client even with valid subscription
    # cookies - robots.txt permits the path, the server refuses anyway. The ~19
    # article fetches this made each week were all wasted, so it now uses the
    # feed's headline and abstract, which is what the digest ended up with
    # regardless. Set back to true if that ever changes.
    full_text: false
    include: ["ai", "artificial intelligence", "openai", "anthropic", "chatbot", "algorithm", "chip", "data center"]

  - type: paywalled
    name: NYT Business
    domain: nytimes.com
    url: https://rss.nytimes.com/services/xml/rss/nyt/Business.xml
    # full_text is off. Measured against a real logged-in session, nytimes.com
    # answers HTTP 403 to a non-browser client even with valid subscription
    # cookies - robots.txt permits the path, the server refuses anyway. The ~29
    # article fetches this made each week were all wasted, so it now uses the
    # feed's headline and abstract, which is what the digest ended up with
    # regardless. Set back to true if that ever changes.
    full_text: false
    include: ["ai", "artificial intelligence", "openai", "anthropic", "nvidia", "chip"]

  - type: paywalled
    name: WSJ Tech
    domain: wsj.com
    # Dow Jones' current feed host. The older feeds.a.dj.com/rss/RSSWSJD.xml
    # endpoint still answers 200 but has been frozen since January 2025, so it
    # contributed nothing to a 7-day window.
    url: https://feeds.content.dowjones.io/public/rss/RSSWSJD
    # full_text is off. wsj.com's robots.txt disallows its article paths for
    # every user-agent, so the fetcher never requested them in the first place -
    # having subscription cookies makes no difference here. Headline and abstract
    # from the feed is what the digest gets. Set back to true if that changes.
    full_text: false

  - type: paywalled
    name: The Atlantic - Technology
    domain: theatlantic.com
    url: https://www.theatlantic.com/feed/channel/technology/
    full_text: true

  # --- AI trade press --------------------------------------------------------
  - type: rss
    name: Ars Technica AI
    url: https://arstechnica.com/ai/feed/
    full_text: true

  - type: rss
    name: MIT Technology Review - AI
    url: https://www.technologyreview.com/topic/artificial-intelligence/feed

  - type: rss
    name: The Verge - AI
    url: https://www.theverge.com/rss/ai-artificial-intelligence/index.xml

  - type: rss
    name: TechCrunch AI
    url: https://techcrunch.com/category/artificial-intelligence/feed/

  - type: rss
    name: VentureBeat AI
    # VentureBeat rate-limits hard: this often answers 429 from residential and
    # cloud IPs alike, in which case the source logs a warning and contributes
    # nothing that week. Kept because it does answer from some networks.
    url: https://venturebeat.com/category/ai/feed/

  # --- labs and primary sources ---------------------------------------------
  # Anthropic publishes no RSS feed - /rss.xml, /index.xml, /feed.xml and
  # /news/rss.xml all return 404 - so there is no primary feed to subscribe to
  # here. Anthropic news reaches the digest through the trade press above, HN
  # (which carries anthropic.com links) and the websearch source below.

  - type: rss
    name: OpenAI Blog
    url: https://openai.com/blog/rss.xml
    full_text: true

  - type: rss
    name: Google DeepMind
    url: https://deepmind.google/blog/rss.xml

  - type: rss
    name: Hugging Face Blog
    url: https://huggingface.co/blog/feed.xml

  - type: rss
    name: Simon Willison
    url: https://simonwillison.net/atom/everything/

  # --- forums ----------------------------------------------------------------
  - type: hackernews
    name: Hacker News
    min_points: 100
    max_items: 40

  - type: reddit
    name: Reddit
    # Reddit's robots.txt disallows anonymous reads of both its pages and their
    # .json views, so this source needs a registered app. Create one (type
    # "script") at https://www.reddit.com/prefs/apps and set REDDIT_CLIENT_ID /
    # REDDIT_CLIENT_SECRET. Leave them unset and the source sits out the run.
    client_id: ${REDDIT_CLIENT_ID}
    client_secret: ${REDDIT_CLIENT_SECRET}
    subreddits: [MachineLearning, LocalLLaMA, artificial]
    timeframe: week
    min_score: 200
    max_items: 30

  # --- research ---------------------------------------------------------------
  - type: arxiv
    name: arXiv
    categories: [cs.AI, cs.LG, cs.CL]
    max_items: 40

  # --- open web (Claude's server-side web search) -----------------------------
  # Finds stories none of the feeds above carried. Costs a few API calls.
  - type: websearch
    name: Web search
    max_uses: 4
    max_items: 40
    queries:
      - "major AI news this week"
      - "new AI model release this week"
      - "AI regulation news this week"
      - "AI funding round this week"
      - "AI safety research news this week"
